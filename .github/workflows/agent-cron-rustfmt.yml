name: format cron function control plane

on:
  push:
    branches:
      - agent/cron-function-control-plane

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cron-function-control-plane
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.97.0"
          components: rustfmt
      - name: Format and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src Cargo.toml
          git rm .github/workflows/agent-cron-rustfmt.yml
          git commit -m 'style: format cron function control plane'
          git push origin HEAD:agent/cron-function-control-plane
