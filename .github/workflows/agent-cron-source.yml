name: clean cron implementation transfer

on:
  push:
    branches:
      - agent/cron-function-control-plane

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cron-function-control-plane
          fetch-depth: 0
      - name: Remove one-shot transfer artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .agent/cron-payload .github/workflows/agent-cron-source.yml
          git commit -m 'chore: remove cron implementation transfer artifacts'
          git push origin HEAD:agent/cron-function-control-plane
