name: agent cron source export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive source tree
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git -czf /tmp/lambda-source.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: lambda-source-${{ github.run_id }}
          path: /tmp/lambda-source.tgz
          if-no-files-found: error
