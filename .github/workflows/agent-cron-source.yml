name: apply cron function control plane

on:
  push:
    branches:
      - agent/cron-function-control-plane

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cron-function-control-plane
          fetch-depth: 0
      - name: Apply audited implementation
        shell: bash
        run: |
          set -euo pipefail
          cat .agent/cron-payload/part-* | base64 -d > /tmp/lambda-cron-implementation.tgz
          tar -xzf /tmp/lambda-cron-implementation.tgz
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml src/lib.rs src/definition.rs src/child_runner.rs src/function_control.rs src/http.rs src/main.rs src/metrics.rs
          if git diff --cached --quiet; then
            echo 'implementation already applied'
            exit 0
          fi
          git commit -m 'feat: add tenant-safe cron function control plane'
          git push origin HEAD:agent/cron-function-control-plane
