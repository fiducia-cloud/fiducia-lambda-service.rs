name: apply cron Clippy fix

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/cron-function-control-plane' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cron-function-control-plane
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.97.0"
          components: rustfmt
      - name: Document intentional Axum response error size
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/http.rs')
          source = path.read_text()
          replacements = [
              (
                  'fn organization_id(headers: &HeaderMap) -> Result<String, Response> {',
                  '#[allow(clippy::result_large_err)]\n// Axum handlers return Response directly so callers can preserve status, headers, and no-store policy.\nfn organization_id(headers: &HeaderMap) -> Result<String, Response> {',
              ),
              (
                  'fn parse_function_input(body: &Bytes) -> Result<FunctionDefinitionInput, Response> {',
                  '#[allow(clippy::result_large_err)]\n// Keep malformed-body handling local to the HTTP boundary rather than leaking transport errors inward.\nfn parse_function_input(body: &Bytes) -> Result<FunctionDefinitionInput, Response> {',
              ),
          ]
          for old, new in replacements:
              if new in source:
                  continue
              if old not in source:
                  raise SystemExit(f'insertion point changed: {old}')
              source = source.replace(old, new, 1)
          path.write_text(source)
          PY
          cargo fmt --all
          git diff --check
          if git diff --quiet -- src/http.rs; then
            echo 'Clippy fix already applied'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/http.rs
          git commit -m 'fix: document Axum response error boundary'
          git push origin HEAD:agent/cron-function-control-plane
